<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pathum Thani Weather</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Basic styling for the body to center the widget vertically and horizontally */
        body {
            font-family: 'Open Sans', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* Ensures body takes at least full viewport height */
            margin: 0;
            overflow-x: hidden; /* Prevent horizontal scroll */
        }

        /* Styling for the weather widget container */
        .weather-widget-container {
            /* Interactive Width: */
            width: 80%; /* Widget takes 80% of the viewport width */
            max-width: 800px; /* Allows it to grow much wider for horizontal displays */
            
            /* Interactive Height: */
            /* The height will naturally adjust to the content of the weather widget. */
            /* The weatherwidget.io script typically renders an iframe whose height is dynamic. */
            height: auto; /* Ensures the container's height adjusts to its content */
            padding: 15px 30px; /* Adjusted padding for a wider layout (vertical horizontal) */
            text-align: center; /* Ensures content inside is centered */
            display: flex; /* Use flexbox to center the widget link */
            justify-content: center;
            align-items: center;
            
            /* Border interactivity */
            border-radius: 15px; /* Initial rounded corners for the container */
            transition: border-radius 0.3s ease-out; /* Smooth transition for border-radius changes */
        }

        /* Styling for the weather widget link itself */
        .weatherwidget-io {
            display: block; /* Make it a block element for width control */
            width: 100%; /* Take full width of its container (which is already responsive) */
            height: auto; /* Allow the widget's height to be determined by its content/script */
            text-decoration: none; /* Remove underline */
            color: inherit; /* Inherit color */
            transition: border-radius 0.3s ease-out; /* Smooth transition for border-radius */
        }
    </style>
</head>
<body>
    <div class="weather-widget-container">
        <a class="weatherwidget-io" href="https://forecast7.com/en/14d02100d53/pathum-thani/"
           data-label_1="PATHUM THANI"
           data-label_2="WEATHER"
           data-font="Open Sans"
           data-icons="Climacons Animated"
           data-theme="weather_one">
            PATHUM THANI WEATHER
        </a>
    </div>

    <script>
        !function(d,s,id){
            var js,fjs=d.getElementsByTagName(s)[0];
            if(!d.getElementById(id)){
                js=d.createElement(s);
                js.id=id;
                js.src='https://weatherwidget.io/js/widget.min.js';
                fjs.parentNode.insertBefore(js,fjs);
            }
        }(document,'script','weatherwidget-io-js');

        // JavaScript to dynamically adjust border-radius
        document.addEventListener('DOMContentLoaded', function() {
            const widgetLink = document.querySelector('.weatherwidget-io');
            const container = document.querySelector('.weather-widget-container');

            // Function to update the border-radius based on the container's width
            function updateBorderRadius() {
                // Get the current width of the container
                const containerWidth = container.offsetWidth;

                // Calculate a dynamic border-radius.
                // This makes the corners more rounded as the widget gets wider.
                // Reduced the multiplier from 0.04 to 0.02 to make the roundness even less.
                const newRadius = Math.min(containerWidth * 0.02, 40); // Max radius of 40px

                // Apply the new border-radius to both the container and the widget link
                container.style.borderRadius = `${newRadius}px`;
                widgetLink.style.borderRadius = `${newRadius}px`;
            }

            // Call the function initially to set the border-radius based on initial size
            updateBorderRadius();

            // Add an event listener for window resize to update the border-radius and implicitly size
            window.addEventListener('resize', updateBorderRadius);
        });
    </script>
</body>
</html>
